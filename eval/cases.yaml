    Not prohibited under Art. 5(1)(f) because the persons whose emotions are inferred are customers, not
    workers; the Commission Guidelines on prohibited AI practices (C(2025) 884, §7.2.2; guid:prohibited-practices-2025.7.2.2.p2)
    state that a call centre tracking its customers' emotions such as anger or impatience is not prohibited
    by Art. 5(1)(f), while tracking its employees' emotions is. Art. 50(3) disclosure applies. FactSheet
    field context_workplace_or_education is set false because the affected persons are not in a workplace
    relationship with the deployer.
  difficulty: hard

