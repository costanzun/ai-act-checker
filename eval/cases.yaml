    transparency.interacts_with_natural_persons: false
  notes: >-
    Remote biometric identification (one-to-many, no active involvement, at a distance; Art. 3(41)) is listed
    in Annex III 1(a); it is not mere 1:1 verification. Art. 5(1)(h) does not apply because the use is by
    a private club, not for law-enforcement purposes. Annex III 1 only covers uses 'in so far as permitted
    under relevant Union or national law' — lawfulness under GDPR Art. 9 is a separate question and is not
    a reason to downgrade the tier.
  difficulty: medium

- id: annex3-1b-gym-gait-health-categorisation
  title: Gym cameras inferring members' health conditions from gait
  description: >-
    We are a start-up selling a camera system to fitness-club chains. It analyses each member's gait and
    posture on the treadmill and infers likely health conditions, such as early mobility or neurological
    disorders, then sorts members into groups so the club can offer tailored programmes and physiotherapy
    packages. It is not sold as a medical device and gives no diagnosis.
  language: en
  source: annex_iii
  role: provider
  expected_tier: high_risk
  expected_overlays: [transparency_art50]
  expected_citations: ['annex:III.1.b', 'art:6.2', 'art:50.3', 'art:16']
  should_ask: false
  facts:
    system_summary: Infers health conditions from members' gait (biometric data) and categorises them for
      targeted offers.
    role: provider
    is_ai_system: true
    in_eu_scope: true
    scope_exclusion: none
    sector: other
    decision_impact: no_decision_about_persons
    annex_iii_area: 1b_biometric_categorisation_sensitive
    annex_i_product: none
    safety_component: false
    context_workplace_or_education: false
    social_scoring: false
    nudify_or_sexual_abuse_material: false
    free_text_notes: ['Inferred attribute is data concerning health (GDPR Art. 9(1)), not one of the Art.
        5(1)(g) attributes.']
    art63.detects_patterns_without_replacing_assessment: false
    art63.improves_prior_human_activity: false
    art63.narrow_procedural_task: false
    art63.preparatory_task_only: false
    art63.profiling_of_natural_persons: true
    biometric.categorisation: true
    biometric.emotion_recognition: false
    biometric.infers_sensitive_attributes: false
    biometric.remote_identification: false
    biometric.uses_biometric_data: true
    gpai.integrates_third_party_gpai: false
    gpai.is_gpai_model: false
    law_enforcement.used_by_or_for_law_enforcement: false
    manipulation.exploits_vulnerabilities: false
    manipulation.subliminal_or_deceptive: false
    transparency.generates_synthetic_content: false
    transparency.interacts_with_natural_persons: false
  notes: >-
    Biometric categorisation (Art. 3(40)): gait is behavioural/physical biometric data used to assign persons
    to categories. The inferred attribute is health — a sensitive attribute under GDPR Art. 9(1) (recital
    54) — so Annex III 1(b) applies. Health is not in the Art. 5(1)(g) list, so not prohibited (FactSheet
    infers_sensitive_attributes mirrors the 5(1)(g) list and is therefore false). The draft Commission guidelines
    on high-risk classification (19 May 2026, §IV.3.1.3 paras 169-170; guid:high-risk-classification-2026-draft.annex3.IV.3.1.3.p3)
    give a near-identical example (gait → health-state categories) as high-risk. Art. 50(3) disclosure applies
    to the deployer (gyms). Ambiguity: if marketed for detecting disease it could also be medical-device
    software (Annex I, Art. 6(1)).
  difficulty: hard

