    art63.improves_prior_human_activity: false
    art63.narrow_procedural_task: false
    art63.preparatory_task_only: false
    biometric.categorisation: false
    biometric.emotion_recognition: false
    biometric.remote_identification: false
    biometric.uses_biometric_data: false
    gpai.integrates_third_party_gpai: false
    gpai.is_gpai_model: false
    law_enforcement.used_by_or_for_law_enforcement: false
    manipulation.exploits_vulnerabilities: false
    manipulation.subliminal_or_deceptive: false
    transparency.generates_synthetic_content: false
    transparency.interacts_with_natural_persons: false
  notes: >-
    Annex III point 2: safety components in the management and operation of the supply of water. The Omnibus
    added Art. 6(1a)-(1b): systems used solely for performance optimisation/efficiency are not safety components,
    but systems whose failure would endanger health and safety are. Here failure endangers health (burst/contamination),
    so it is a safety component. Point 2 has no letters, so the ID is annex:III.2. Note Art. 27 FRIA and
    Art. 49 deployer registration carve out point 2.
  difficulty: medium

