- id: annex3-1a-stadium-watchlist-rbi
  title: Face matching against a banned-fans list at stadium gates
  description: >-
    We run a football club in Turin and want to install a vendor's camera system at the stadium turnstiles.
    It scans the faces of everyone walking towards the gates and compares them in real time with our database
    of fans under a stadium ban, alerting stewards on a match. Supporters do nothing actively; the cameras
    capture them from a few metres away.
  language: en
