[project]
name = "ai-act-checker-backend"
version = "0.1.0"
description = "EU AI Act Checker — FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    "lancedb>=0.15",
    "pyarrow>=16",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "rank-bm25>=0.2",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "mlx-lm>=0.20; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "anyio>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
